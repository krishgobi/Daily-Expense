services:
  - type: web
    name: daily-expense-api
    env: python
    pythonVersion: '3.10'
    region: oregon
    plan: free
    
    buildCommand: |
      pip install --upgrade pip setuptools wheel &&
      pip install --no-build-isolation --prefer-binary -r backend/requirements.txt &&
      cd backend && alembic upgrade head

    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port 8000"

    envVars:
      - key: ENVIRONMENT
        value: production
